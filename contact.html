                <p class="panel-label">transmit.message</p>

                <div class="form-field">
                    <label for="cf-name"><b>&gt;</b> name</label>
                    <input id="cf-name" name="name" type="text" autocomplete="name" required>
                </div>
                <div class="form-field">
                    <label for="cf-email"><b>&gt;</b> email</label>
                    <input id="cf-email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="cf-message"><b>&gt;</b> message</label>
                    <textarea id="cf-message" name="message" required
                        placeholder="what are we building?"></textarea>
                </div>

                <button class="btn btn-solid" type="submit">transmit ↗</button>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </form>
